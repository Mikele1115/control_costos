# Kamal 2 — despliegue de Control de Costos La Splendida
#
# Los pasos completos estan en DESPLIEGUE.md
service: control_costos

# <<< 1 >>> tu usuario del registro de imagenes
#   Docker Hub:  miusuario/control_costos
#   GitHub:      ghcr.io/miusuario/control_costos
image: ghcr.io/mikele1115/control_costos

servers:
  web:
    # <<< 2 >>> la IP de tu VPS
    - 52.23.104.52

proxy:
  # Sin dominio todavia: se entra por http://52.23.104.52, sin candado.
  # Cuando el DNS apunte a esta IP, poner `ssl: true` y descomentar
  # `host`: Kamal pide el certificado a Let's Encrypt solo.
  ssl: false
  # host: controlcostossplendida.cl

  healthcheck:
    path: /up

registry:
  # Para Docker Hub, borra la linea `server`.
  server: ghcr.io
  username: mikele1115
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  # Tu maquina y el VPS son x86_64. Con un servidor ARM: arm64
  arch: amd64

env:
  clear:
    # Nombre del contenedor de PostgreSQL en la red de Kamal:
    # <service>-<accesorio>
    DB_HOST: control_costos-db

    # Muestra las credenciales de demostracion en el login.
    # Quitalo si algun dia esto deja de ser una demo.
    DEMO: 1

    # El worker de trabajos corre dentro de Puma: un contenedor menos
    # en un servidor pequeno.
    SOLID_QUEUE_IN_PUMA: true

    # Un solo worker de Puma: en 2 GB conviven la app y PostgreSQL.
    WEB_CONCURRENCY: 1
  secret:
    - RAILS_MASTER_KEY
    - CONTROL_COSTOS_DATABASE_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  sembrar: app exec "PERMITIR_SEED=1 bin/rails db:seed"

accessories:
  db:
    image: postgres:17
    # <<< 2 >>> la misma IP del VPS
    host: 52.23.104.52

    # Atado a 127.0.0.1: PostgreSQL NO queda expuesto a internet.
    port: "127.0.0.1:5432:5432"

    env:
      clear:
        POSTGRES_USER: control_costos
        POSTGRES_DB: control_costos_production
      secret:
        - POSTGRES_PASSWORD

    # Se ejecuta la primera vez que se crea el volumen: crea las tres
    # bases que Rails 8 usa para cache, trabajos y websockets.
    files:
      - db/produccion/init.sql:/docker-entrypoint-initdb.d/init.sql

    # Los datos viven en el servidor, no dentro del contenedor.
    directories:
      - data:/var/lib/postgresql/data
