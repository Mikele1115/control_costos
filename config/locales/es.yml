es:
  # rails-i18n trae el castellano de Espana: moneda en euros y simbolo
  # detras del numero. Lo adaptamos.
  number:
    currency:
      format:
        unit: "$"
        format: "%u%n"
        delimiter: "."
        separator: ","
        precision: 2

  activerecord:
    models:
      insumo:
        one: Insumo
        other: Insumos
      proveedor:
        one: Proveedor
        other: Proveedores
      precio_insumo:
        one: Precio
        other: Precios
      receta:
        one: Receta
        other: Recetas
      ingrediente:
        one: Ingrediente
        other: Ingredientes

    attributes:
      insumo:
        nombre: Nombre
        unidad_base: Unidad base
        merma_porcentaje: Merma
        precio_insumos: precios cargados
        proveedor: Proveedor
      proveedor:
        nombre: Nombre
        contacto: Contacto
        telefono: Teléfono
        insumos: insumos
      precio_insumo:
        insumo: Insumo
        precio_compra: Precio de compra
        cantidad_compra: Cantidad comprada
        unidad_compra: Unidad de compra
        costo_por_unidad_base: Costo por unidad base
        vigente_desde: Vigente desde
      receta:
        nombre: Nombre
        tipo: Tipo
        categoria: Sección de la carta
        precio_venta: Precio de venta
        rendimiento_cantidad: Rendimiento
        rendimiento_unidad: Unidad de rendimiento
        ingredientes: ingredientes
        usos: otras recetas
      ingrediente:
        receta: Receta
        insumable: Ingrediente
        insumable_id: Ingrediente
        cantidad: Cantidad
        unidad: Unidad

    errors:
      messages:
        # Formulacion entre parentesis: encaja con cualquier texto sin
        # problemas de concordancia de genero ni numero.
        restrict_dependent_destroy:
          has_one: "No se puede eliminar: en uso (%{record})"
          has_many: "No se puede eliminar: en uso (%{record})"

      models:
        insumo:
          attributes:
            nombre:
              taken: "ya está en uso"
        receta:
          attributes:
            nombre:
              taken: "ya está en uso"

  # Etiquetas propias de la aplicacion, para las vistas
  autenticacion:
    entrar: Entrar
    salir: Salir
    correo: Correo electrónico
    contrasena: Contraseña
    contrasena_nueva: Contraseña nueva
    contrasena_repetir: Repetir la contraseña
    olvide: ¿Olvidaste tu contraseña?
    volver: Volver a entrar
    titulo_login: Entrar
    titulo_olvide: Recuperar la contraseña
    titulo_nueva: Elegí una contraseña nueva
    enviar_instrucciones: Enviarme las instrucciones
    guardar: Guardar la contraseña
    credenciales_invalidas: Correo o contraseña incorrectos.
    demasiados_intentos: Demasiados intentos. Probá de nuevo en unos minutos.
    instrucciones_enviadas: Si existe una cuenta con ese correo, te enviamos las instrucciones.
    contrasena_actualizada: Tu contraseña quedó actualizada. Ya podés entrar.
    contrasenas_no_coinciden: Las contraseñas no coinciden.
    enlace_invalido: El enlace de recuperación no es válido o ya caducó.
    correo_asunto: Recuperá tu contraseña
  avisos:
    food_cost:
      asunto:
        one: "Un plato empeoró su food cost"
        other: "%{count} platos empeoraron su food cost"
  costeo:
    bandas:
      bajo: bajo
      sano: sano
      alto: alto
      critico: crítico
      perdida: se vende bajo costo
    tipos:
      plato: Plato
      preparacion: Preparación
    categorias:
      principal: Platos principales
      compartir: Para compartir
      postre: Postres
      bebestible: Bebestibles
    unidades:
      g: gramos
      kg: kilogramos
      ml: mililitros
      l: litros
      unidad: unidades
      docena: docenas
    resumen:
      unico: "Hay un único precio cargado para %{insumo}, vigente desde el %{fecha}."
      aumento: "Desde su primer precio, el %{fecha}, %{insumo} acumula un aumento del %{variacion}."
      baja: "Desde su primer precio, el %{fecha}, %{insumo} acumula una baja del %{variacion}."
      estable: "%{insumo} volvió al mismo precio que tenía el %{fecha}, tras %{cambios}."
    indicadores:
      costo_total: Costo total
      costo_por_porcion: Costo por porción
      food_cost: Food cost
      margen_bruto: Margen bruto
      precio_sugerido: Precio sugerido
